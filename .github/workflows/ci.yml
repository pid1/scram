name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # .npmrc's min-release-age (7-day supply-chain cooldown) needs npm
      # 11.10+; older npm ignores it silently. Node 24 bundles a new enough
      # npm today; fail loudly if that ever changes.
      - name: Check npm honors the release-age cooldown
        run: |
          v=$(npm --version)
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&b<10)) { console.error(`npm ${process.argv[1]} < 11.10 ignores min-release-age`); process.exit(1) }' "$v"
          echo "npm $v, min-release-age=$(npm config get min-release-age)"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite runs inside workerd via @cloudflare/vitest-plugin, so
      # it needs no Cloudflare account and no secrets. Deploys are not done
      # here: Cloudflare Workers Builds publishes main, and cf-fallback.yml
      # covers the pushes it misses.
      - name: Test
        run: npm test
