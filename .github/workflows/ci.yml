name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite runs inside workerd via @cloudflare/vitest-plugin, so
      # it needs no Cloudflare account and no secrets. Deploys are not done
      # here: Cloudflare Workers Builds publishes main, and cf-fallback.yml
      # covers the pushes it misses.
      - name: Test
        run: npm test
